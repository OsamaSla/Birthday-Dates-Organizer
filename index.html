<body>
  <div class="confetti-container" id="confetti"></div>
  <header>
    <div class="header-content">
      <div class="cake-icon">🎂</div>
      <h1>قائمة أعياد الميلاد</h1>
      <p class="subtitle">تابع أعياد ميلاد أحبائك</p>
    </div>
  </header>
  <main>
    <div class="pdf-title" id="pdfTitle">
      <span class="pdf-icon">🎂</span>
      <h1>قائمة أعياد الميلاد</h1>
      <span class="pdf-icon">🎉</span>
    </div>
    <div class="pdf-date" id="pdfDate"></div>
    <div class="tabs-container" id="tabsContainer"></div>
    <div class="group-dropdown-row" id="groupDropdownRow" style="display:none;">
      <select class="group-dropdown" id="groupDropdown"></select>
      <button class="group-dropdown-add" onclick="createGroup()" title="إضافة مجموعة جديدة">+</button>
    </div>
    <div class="tab-context-overlay" id="tabContextOverlay" onclick="closeTabMenu()"></div>
    <div class="tab-context-menu" id="tabContextMenu"></div>
    <div class="form-container">
      <h2 id="formTitle">إضافة عيد ميلاد جديد</h2>
      <form id="birthdayForm">
        <input type="hidden" id="editId" value="">
        <div class="form-group">
          <label for="name">الاسم</label>
          <input type="text" id="name" placeholder="أدخل الاسم" required>
        </div>
        <div class="form-group">
          <label>تاريخ الميلاد</label>
          <div class="date-selectors">
            <input type="number" id="daySelect" min="1" max="31" placeholder="يوم" required>
            <span class="date-separator">/</span>
            <input type="number" id="monthSelect" min="1" max="12" placeholder="شهر" required>
            <span class="month-name" id="monthName"></span>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" id="submitBtn" class="btn btn-primary">إضافة</button>
          <button type="button" id="cancelBtn" class="btn btn-secondary" style="display:none;" onclick="cancelEdit()">إلغاء</button>
        </div>
      </form>
    </div>
    <div class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="بحث عن اسم...">
      </div>
      <div class="filter-box">
        <select id="monthFilter">
          <option value="0">جميع الشهور</option>
          <option value="1">يناير</option>
          <option value="2">فبراير</option>
          <option value="3">مارس</option>
          <option value="4">أبريل</option>
          <option value="5">مايو</option>
          <option value="6">يونيو</option>
          <option value="7">يوليو</option>
          <option value="8">أغسطس</option>
          <option value="9">سبتمبر</option>
          <option value="10">أكتوبر</option>
          <option value="11">نوفمبر</option>
          <option value="12">ديسمبر</option>
        </select>
      </div>
      <div class="action-buttons">
        <button class="btn btn-sm btn-calendar" id="calendarToggle" onclick="toggleCalendarView()">📅 عرض تقويم</button>
        <button class="btn btn-pdf" onclick="saveAsPDF()">📄 حفظ PDF</button>
        <button class="btn btn-sm btn-export" onclick="exportData()">💾 تصدير</button>
        <button class="btn btn-sm btn-import" onclick="document.getElementById('importFile').click()">📂 استيراد</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
        <button class="btn btn-delete-all" onclick="deleteAll()">🗑️ حذف الكل</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div id="birthdayList" class="birthday-list"></div>
    <div id="calendarGrid" class="calendar-grid" style="display:none;"></div>
    <div id="emptyState" class="empty-state">
      <div class="empty-icon">🎁</div>
      <p>لا توجد أعياد ميلاد بعد</p>
      <p class="empty-sub">ابدأ بإضافة أعياد ميلاد أحبائك!</p>
    </div>
  </main>
  <footer>
    <p><span dir="ltr">made with <span class="big-heart">❤️</span></span></p>
  </footer>
  <script>
    const STORAGE_KEY = 'birthdays';
    const monthNames = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    const monthEmojis = ['❄️','💝','🌸','🌷','☀️','🌻','🎆','🎈','🍂','🎃','🍁','🎄'];
    const groupColors = ['#e74c3c','#e91e63','#9c27b0','#673ab7','#3f51b5','#2196f3','#00bcd4','#009688','#4caf50','#ff9800','#795548','#f44336','#8bc34a','#ff5722','#607d8b','#00897b'];
    const defaultData = [{"id":"d01","name":"أميرة","date":"30/01"},{"id":"d02","name":"ميخا","date":"07/02"},{"id":"d03","name":"إخلاص","date":"05/02"},{"id":"d04","name":"القس بطرس غريب","date":"13/03"},{"id":"d05","name":"ديانا","date":"01/04"},{"id":"d06","name":"مادلين","date":"05/04"},{"id":"d07","name":"حلوة","date":"07/04"},{"id":"d08","name":"آمنة","date":"05/05"},{"id":"d09","name":"إيفيت","date":"08/05"},{"id":"d10","name":"ميار","date":"25/05"},{"id":"d11","name":"فيفيان","date":"04/06"},{"id":"d12","name":"آمال خورية","date":"05/06"},{"id":"d13","name":"عرين نخلة","date":"20/07"},{"id":"d14","name":"أنغام","date":"25/07"},{"id":"d15","name":"ريمونة","date":"01/09"},{"id":"d16","name":"دانيال","date":"19/09"},{"id":"d17","name":"كريمة","date":"05/10"},{"id":"d18","name":"أسامة نخلة","date":"11/10"},{"id":"d19","name":"سهيلة","date":"17/10"},{"id":"d20","name":"جوزفين","date":"23/10"},{"id":"d21","name":"يسرى","date":"15/11"},{"id":"d22","name":"ميراي","date":"16/11"},{"id":"d23","name":"صموئيل","date":"20/11"},{"id":"d24","name":"القس حسام","date":"15/12"}];
    let appData = null;
    function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }
    function loadData() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          if (parsed.groups) { appData = parsed; }
          else if (Array.isArray(parsed)) {
            appData = { groups: [{ id: generateId(), name: 'الكل', birthdays: parsed }], activeGroupId: null };
            appData.activeGroupId = appData.groups[0].id;
          } else {
            appData = { groups: [{ id: generateId(), name: 'الكل', birthdays: defaultData }], activeGroupId: null };
            appData.activeGroupId = appData.groups[0].id;
          }
        } catch { appData = null; }
      }
      if (!appData || !appData.groups || appData.groups.length === 0) {
        const gid = generateId();
        appData = { groups: [{ id: gid, name: 'الكل', birthdays: defaultData }], activeGroupId: gid };
      }
      if (!appData.activeGroupId || !appData.groups.find(g => g.id === appData.activeGroupId)) {
        appData.activeGroupId = appData.groups[0].id;
      }
      appData.groups.forEach((g, i) => { if (!g.color) g.color = groupColors[i % groupColors.length]; });
    }
    function getActiveGroup() { return appData.groups.find(g => g.id === appData.activeGroupId); }
    function getBirthdays() { const g = getActiveGroup(); return g ? g.birthdays : []; }
    function normalizeDate(dateStr) { if (dateStr.includes('-')) { const parts = dateStr.split('-'); return `${parts[2]}/${parts[1]}`; } return dateStr; }
    function dedupBirthdays(list) { const seen = new Set(); return list.filter(b => { const key = b.name.trim().toLowerCase() + '|' + normalizeDate(b.date); if (seen.has(key)) return false; seen.add(key); return true; }); }
    function dedupAll() { appData.groups.forEach(g => { g.birthdays = dedupBirthdays(g.birthdays); }); }
    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); if (calendarViewActive) renderCalendar(); }

    loadData();

    const form = document.getElementById('birthdayForm');
    const nameInput = document.getElementById('name');
    const daySelect = document.getElementById('daySelect');
    const monthSelect = document.getElementById('monthSelect');
    const monthNameDisplay = document.getElementById('monthName');
    const editIdInput = document.getElementById('editId');
    const submitBtn = document.getElementById('submitBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const formTitle = document.getElementById('formTitle');
    const searchInput = document.getElementById('searchInput');
    const monthFilter = document.getElementById('monthFilter');
    const listContainer = document.getElementById('birthdayList');
    const emptyState = document.getElementById('emptyState');
    const statsContainer = document.getElementById('stats');
    const tabsContainer = document.getElementById('tabsContainer');
    form.addEventListener('submit', handleSubmit);
    searchInput.addEventListener('input', () => { if (calendarViewActive) renderCalendar(); else renderList(); });
    monthFilter.addEventListener('change', () => { if (calendarViewActive) renderCalendar(); else renderList(); });
    monthSelect.addEventListener('input', updateMonthName);
    function updateMonthName() { const val = parseInt(monthSelect.value); monthNameDisplay.textContent = (val >= 1 && val <= 12) ? monthNames[val - 1] : ''; }
    function parseDate(dateStr) { const [d, m] = dateStr.split('/').map(Number); return { day: d, month: m }; }
    function formatDate(dateStr) { const { day, month } = parseDate(dateStr); return `${String(day).padStart(2,'0')}/${String(month).padStart(2,'0')}`; }
    function isToday(dateStr) { const today = new Date(); const { day, month } = parseDate(dateStr); return today.getMonth() === month - 1 && today.getDate() === day; }
    function getNextBirthday(dateStr) { const today = new Date(); const { day, month } = parseDate(dateStr); const thisYear = new Date(today.getFullYear(), month - 1, day); if (thisYear < today) thisYear.setFullYear(today.getFullYear() + 1); return Math.ceil((thisYear - today) / (1000 * 60 * 60 * 24)); }

    function renderTabs() {
      const tabsEl = document.getElementById('tabsContainer');
      const dropRow = document.getElementById('groupDropdownRow');
      const useDropdown = appData.groups.length > 5;
      tabsEl.style.display = useDropdown ? 'none' : 'flex';
      dropRow.style.display = useDropdown ? 'flex' : 'none';
      if (useDropdown) {
        const sel = document.getElementById('groupDropdown');
        sel.innerHTML = '';
        appData.groups.forEach(g => {
          const opt = document.createElement('option');
          opt.value = g.id;
          opt.textContent = g.name + ' (' + g.birthdays.length + ')';
          opt.selected = g.id === appData.activeGroupId;
          sel.appendChild(opt);
        });
        sel.onchange = () => switchGroup(sel.value);
      } else {
        tabsEl.innerHTML = '';
        appData.groups.forEach(g => {
          const color = g.color || groupColors[appData.groups.indexOf(g) % groupColors.length];
          const isActive = g.id === appData.activeGroupId;
          const tab = document.createElement('button');
          tab.className = `tab${isActive ? ' active' : ''}`;
          if (isActive) { tab.style.background = color; tab.style.color = 'white'; } else { tab.style.background = color + '33'; tab.style.color = color; }
          tab.innerHTML = `<span>${g.name}</span><span class="tab-count" style="${isActive ? 'background:rgba(255,255,255,0.25);color:white' : 'background:' + color + '22'}">${g.birthdays.length}</span><span class="tab-menu-btn" onclick="event.stopPropagation();showTabMenu(event,'${g.id}')" style="color:inherit">⋮</span>`;
          tab.addEventListener('click', () => switchGroup(g.id));
          tabsEl.appendChild(tab);
        });
        const addBtn = document.createElement('button');
        addBtn.className = 'tab-add';
        addBtn.textContent = '+';
        addBtn.title = 'إضافة مجموعة جديدة';
        addBtn.addEventListener('click', createGroup);
        tabsEl.appendChild(addBtn);
      }
    }
    let activeTabMenuId = null;
    function showTabMenu(e, id) {
      activeTabMenuId = id;
      const g = appData.groups.find(x => x.id === id);
      const menu = document.getElementById('tabContextMenu');
      const overlay = document.getElementById('tabContextOverlay');
      menu.innerHTML = `<button onclick="closeTabMenu();renameGroup('${id}')">✏️ تعديل الاسم</button><button class="delete" onclick="closeTabMenu();deleteGroup('${id}')">🗑️ حذف المجموعة</button>`;
      const rect = e.target.getBoundingClientRect();
      menu.style.top = (rect.bottom + 4) + 'px';
      menu.style.left = Math.min(rect.left, window.innerWidth - 170) + 'px';
      menu.classList.add('show');
      overlay.classList.add('show');
    }
    function closeTabMenu() {
      document.getElementById('tabContextMenu').classList.remove('show');
      document.getElementById('tabContextOverlay').classList.remove('show');
      activeTabMenuId = null;
    }
    function createGroup() {
      const name = prompt('اسم المجموعة الجديدة:');
      if (!name || !name.trim()) return;
      const id = generateId();
      const color = groupColors[appData.groups.length % groupColors.length];
      appData.groups.push({ id, name: name.trim(), birthdays: [], color });
      appData.activeGroupId = id;
      save(); renderTabs(); renderList();
    }
    function switchGroup(id) {
      appData.activeGroupId = id;
      cancelEdit();
      searchInput.value = '';
      monthFilter.value = '0';
      save(); renderTabs();
      if (calendarViewActive) renderCalendar(); else renderList();
    }
    function renameGroup(id) {
      const g = appData.groups.find(x => x.id === id);
      if (!g) return;
      const name = prompt('اسم المجموعة الجديد:', g.name);
      if (!name || !name.trim()) return;
      g.name = name.trim();
      save(); renderTabs();
    }
    function deleteGroup(id) {
      if (appData.groups.length <= 1) { alert('لا يمكن حذف المجموعة الوحيدة!'); return; }
      const g = appData.groups.find(x => x.id === id);
      if (!g) return;
      if (!confirm(`هل أنت متأكد من حذف "${g.name}" وجميع أعياد الميلاد فيها؟`)) return;
      appData.groups = appData.groups.filter(x => x.id !== id);
      if (appData.activeGroupId === id) appData.activeGroupId = appData.groups[0].id;
      cancelEdit(); searchInput.value = ''; monthFilter.value = '0';
      save(); renderTabs();
      if (calendarViewActive) renderCalendar(); else renderList();
    }

    function handleSubmit(e) { e.preventDefault(); const name = nameInput.value.trim(); const day = daySelect.value; const month = monthSelect.value; if (!name || !day || !month) return; const date = `${String(day).padStart(2,'0')}/${String(month).padStart(2,'0')}`; const editId = editIdInput.value; const birthdays = getBirthdays(); if (editId) { const idx = birthdays.findIndex(b => b.id === editId); if (idx !== -1) { birthdays[idx] = { ...birthdays[idx], name, date }; } cancelEdit(); } else {       const dup = birthdays.find(b => b.name.trim().toLowerCase() === name.toLowerCase() && normalizeDate(b.date) === date); if (dup) { alert('هذا الاسم مع هذا التاريخ موجود بالفعل!'); return; } birthdays.push({ id: generateId(), name, date }); } save(); renderTabs(); if (calendarViewActive) renderCalendar(); else renderList(); form.reset(); }
    function cancelEdit() { editIdInput.value = ''; submitBtn.textContent = 'إضافة'; formTitle.textContent = 'إضافة عيد ميلاد جديد'; cancelBtn.style.display = 'none'; form.reset(); monthNameDisplay.textContent = ''; }
    function editBirthday(id) { const birthdays = getBirthdays(); const b = birthdays.find(x => x.id === id); if (!b) return; nameInput.value = b.name; const { day, month } = parseDate(b.date); daySelect.value = day; monthSelect.value = month; updateMonthName(); editIdInput.value = b.id; submitBtn.textContent = 'تحديث'; formTitle.textContent = 'تعديل عيد الميلاد'; cancelBtn.style.display = 'inline-block'; nameInput.focus(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    function deleteBirthday(id) { if (!confirm('هل أنت متأكد من الحذف؟')) return; const birthdays = getBirthdays(); const g = getActiveGroup(); g.birthdays = birthdays.filter(b => b.id !== id); save(); renderTabs(); if (calendarViewActive) renderCalendar(); else renderList(); }
    function deleteAll() { if (!confirm('هل أنت متأكد من حذف جميع أعياد الميلاد في هذه المجموعة؟')) return; getActiveGroup().birthdays = []; save(); renderTabs(); if (calendarViewActive) renderCalendar(); else renderList(); }
    function exportData() { const dataStr = JSON.stringify(appData, null, 2); const blob = new Blob([dataStr], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'birthdays.json'; a.click(); URL.revokeObjectURL(url); }
    function importData(event) { const file = event.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = function(e) { try { const data = JSON.parse(e.target.result); if (data.groups) { data.groups.forEach(ig => { const existing = appData.groups.find(g => g.name.trim().toLowerCase() === ig.name.trim().toLowerCase()); if (existing) { const seen = new Set(existing.birthdays.map(b => b.name.trim().toLowerCase() + '|' + normalizeDate(b.date))); ig.birthdays.forEach(b => { const key = b.name.trim().toLowerCase() + '|' + normalizeDate(b.date); if (!seen.has(key)) { existing.birthdays.push(b); seen.add(key); } }); } else { const newId = generateId(); appData.groups.push({ id: newId, name: ig.name, birthdays: ig.birthdays, color: ig.color || groupColors[appData.groups.length % groupColors.length] }); } }); } else if (Array.isArray(data)) { const gid = generateId(); appData.groups.push({ id: gid, name: 'مستورد', birthdays: data, color: groupColors[appData.groups.length % groupColors.length] }); } else { alert('الملف غير صالح'); return; } save(); renderTabs(); if (calendarViewActive) renderCalendar(); else renderList(); alert('تم الاستيراد بنجاح!'); } catch { alert('خطأ في قراءة الملف'); } }; reader.readAsText(file); event.target.value = ''; }
    function getFilteredBirthdays() { const query = searchInput.value.trim().toLowerCase(); const filterMonth = parseInt(monthFilter.value); return getBirthdays().filter(b => { const matchesName = b.name.toLowerCase().includes(query); const { month } = parseDate(b.date); return matchesName && (filterMonth === 0 || month === filterMonth); }); }
    function updateStats() { const filtered = getFilteredBirthdays(); if (filtered.length === 0) { statsContainer.textContent = ''; return; } const todayCount = filtered.filter(b => isToday(b.date)).length; statsContainer.textContent = `إجمالي الأعياد: ${filtered.length}${todayCount > 0 ? ` | أعياد اليوم: ${todayCount}` : ''}`; }
    function renderList() { let filtered = getFilteredBirthdays(); filtered.sort((a, b) => { const pa = parseDate(a.date); const pb = parseDate(b.date); return (pa.month - pb.month) || (pa.day - pb.day); }); listContainer.innerHTML = ''; if (filtered.length === 0) { emptyState.style.display = 'block'; statsContainer.textContent = ''; return; } emptyState.style.display = 'none'; updateStats(); const groups = {}; filtered.forEach(b => { const { month } = parseDate(b.date); if (!groups[month]) groups[month] = []; groups[month].push(b); }); Object.keys(groups).sort((a, b) => a - b).forEach(month => { const m = parseInt(month); const group = document.createElement('div'); group.className = 'month-group'; const header = document.createElement('div'); header.className = `month-header month-${m}`; header.innerHTML = `<span class="emoji">${monthEmojis[m - 1]}</span> ${monthNames[m - 1]} (${groups[m].length})`; group.appendChild(header); groups[m].forEach(b => { const today = isToday(b.date); const card = document.createElement('div'); card.className = `birthday-card${today ? ' today' : ''}`; const nextDays = getNextBirthday(b.date); card.innerHTML = `<div class="birthday-info"><span class="birthday-name">${b.name} ${today ? '🎉' : ''}</span><span class="birthday-date"><span>${formatDate(b.date)}</span>${nextDays === 0 ? '<span>✨</span>' : `<span class="days-sep">–</span><span class="days-count" dir="rtl">${nextDays} يوم</span>`}</span></div><div class="birthday-actions"><button class="btn-edit" onclick="editBirthday('${b.id}')">✏️</button><button class="btn-delete" onclick="deleteBirthday('${b.id}')">🗑️</button></div>`; group.appendChild(card); }); listContainer.appendChild(group); }); }
    function saveAsPDF() { const now = new Date(); const d = String(now.getDate()).padStart(2,'0'); const m = String(now.getMonth()+1).padStart(2,'0'); const y = now.getFullYear(); const h = String(now.getHours()).padStart(2,'0'); const min = String(now.getMinutes()).padStart(2,'0'); document.getElementById('pdfDate').textContent = `Created: ${d}/${m}/${y} ${h}:${min}`; const wasCalendar = calendarViewActive; if (!calendarViewActive) { calendarViewActive = true; calendarGrid.style.display = 'grid'; listContainer.style.display = 'none'; renderCalendar(); } document.body.classList.add('pdf-mode'); setTimeout(() => { window.print(); setTimeout(() => { document.body.classList.remove('pdf-mode'); if (!wasCalendar) { calendarViewActive = false; calendarGrid.style.display = 'none'; listContainer.style.display = 'flex'; renderList(); } }, 500); }, 100); }
    function createConfetti() { const container = document.getElementById('confetti'); const colors = ['#e74c3c','#e91e63','#9c27b0','#3f51b5','#2196f3','#4caf50','#ff9800','#f44336']; for (let i = 0; i < 50; i++) { const piece = document.createElement('div'); piece.className = 'confetti-piece'; piece.style.left = Math.random() * 100 + '%'; piece.style.background = colors[Math.floor(Math.random() * colors.length)]; piece.style.animationDelay = Math.random() * 3 + 's'; piece.style.animationDuration = (Math.random() * 2 + 2) + 's'; piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '0'; container.appendChild(piece); } }
    let calendarViewActive = false;
    const calendarGrid = document.getElementById('calendarGrid');
    const calendarToggle = document.getElementById('calendarToggle');
    function toggleCalendarView() { calendarViewActive = !calendarViewActive; calendarGrid.style.display = calendarViewActive ? 'grid' : 'none'; listContainer.style.display = calendarViewActive ? 'none' : 'flex'; calendarToggle.classList.toggle('active', calendarViewActive); if (calendarViewActive) renderCalendar(); else renderList(); }
    function renderCalendar() { calendarGrid.innerHTML = ''; const filtered = getFilteredBirthdays(); updateStats(); for (let m = 1; m <= 12; m++) { const monthBirthdays = filtered.filter(b => { const { month } = parseDate(b.date); return month === m; }).sort((a, b) => parseDate(a.date).day - parseDate(b.date).day); const cell = document.createElement('div'); cell.className = 'cal-month'; cell.innerHTML = `<div class="cal-month-header month-${m}"><span>${monthEmojis[m-1]} ${monthNames[m-1]}</span><span class="count">${monthBirthdays.length}</span></div><div class="cal-month-body">${monthBirthdays.length === 0 ? '<div class="cal-empty">—</div>' : monthBirthdays.map(b => { const today = isToday(b.date); const { day } = parseDate(b.date); const daysLeft = getNextBirthday(b.date); return `<div class="cal-bday${today ? ' today' : ''}"><span class="cal-bday-name">${b.name}</span><span class="cal-bday-date"><span>${String(day).padStart(2,'0')}/${String(m).padStart(2,'0')}</span>${daysLeft === 0 ? '<span>✨</span>' : `<span class="days-sep">–</span><span class="days-count" dir="rtl">${daysLeft} يوم</span>`}</span></div>`; }).join('')}</div>`; calendarGrid.appendChild(cell); } }
    createConfetti();
    renderTabs();
    renderList();
  </script>
</body>
</html>
